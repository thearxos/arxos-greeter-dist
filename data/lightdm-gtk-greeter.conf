[greeter]
background = /usr/share/backgrounds/arxos/arxos-login.png
theme-name = Adwaita-dark
icon-theme-name = kora
font-name = Inter 11
xft-antialias = true
xft-hintstyle = hintfull
position = 50%,center 62%,center
clock-format = %H:%M   %A %d %B
indicators = ~host;~spacer;~clock;~spacer;~layout;~session;~power
user-background = false
