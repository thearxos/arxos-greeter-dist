<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARXOS</title>
<style>
:root{
  --bg:#0a0a0c; --fg:#fff; --muted:rgba(255,255,255,.62);
  --accent:#e8702a; --accent-hi:#d2611f; --accent-soft:rgba(232,112,42,.14);
  --card:rgba(14,14,18,.82); --line:rgba(255,255,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Inter","Noto Sans",sans-serif;color:var(--fg);overflow:hidden;
  background:#0a0a0c;
  background-image:
    radial-gradient(60% 45% at 50% 8%,rgba(232,112,42,.14),transparent 60%),
    radial-gradient(70% 55% at 50% 120%,rgba(232,112,42,.10),transparent 66%),
    url("bg.png");
  background-size:cover;background-position:center;
}
.serif{font-family:"Playfair Display","Noto Serif",serif;font-style:italic}
.grid{position:fixed;inset:0;z-index:0;opacity:.30;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:54px 54px;mask-image:radial-gradient(70% 60% at 50% 42%,#000,transparent 82%)}
/* the diamond mark */
.diamond{position:fixed;z-index:0;top:50%;left:50%;transform:translate(-50%,-50%);width:min(70vmin,520px);aspect-ratio:1;pointer-events:none;opacity:.9}
.diamond .ring{position:absolute;inset:0;border:1px solid rgba(232,112,42,.26);border-radius:22px;transform:rotate(45deg);animation:spin 46s linear infinite}
.diamond .ring:nth-child(2){inset:12%;border-color:rgba(232,112,42,.16);animation-duration:66s;animation-direction:reverse}
.diamond .ring:nth-child(3){inset:26%;border-color:rgba(255,255,255,.06);animation-duration:82s}
.diamond .core{position:absolute;inset:39%;border-radius:50%;background:radial-gradient(circle,rgba(232,112,42,.5),rgba(232,112,42,.04) 70%);filter:blur(6px);animation:pulse 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(405deg)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;font-size:.82rem;color:var(--muted);background:linear-gradient(180deg,rgba(8,8,10,.55),transparent)}
.topbar .host{letter-spacing:.06em}
.topbar .host b{color:var(--fg)}
#clock{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.topbar .right{display:flex;align-items:center;gap:18px}
.segwrap{display:flex;align-items:center;gap:9px}
.seglabel{font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.4);user-select:none}
.sessions{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.045);backdrop-filter:blur(8px)}
.sessions .pill{border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:.76rem;letter-spacing:.01em;padding:6px 13px;border-radius:9px;cursor:pointer;transition:.18s;white-space:nowrap}
.sessions .pill:hover{color:var(--fg)}
.sessions .pill.active{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(232,112,42,.42)}
.sessions.single{background:transparent;border-color:transparent;padding:3px 2px}
.sessions.single .pill{cursor:default;color:var(--fg)}
.sessions.single .pill.active{background:transparent;box-shadow:none;color:var(--fg)}
.power{display:flex;align-items:center;gap:3px}
.pw{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;color:var(--muted);border-radius:10px;cursor:pointer;transition:.18s}
.pw svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw:hover{color:var(--accent);background:rgba(255,255,255,.06)}
#btnShutdown:hover{color:#ff5c5c;background:rgba(255,92,92,.10)}

/* center login */
.stage{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.brand{text-align:center}
.brand .name{font-size:clamp(2.4rem,7vw,4.2rem);letter-spacing:-.05em;line-height:1}
.brand .tag{margin-top:8px;font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.card{width:min(90vw,360px);background:var(--card);border:1px solid rgba(232,112,42,.32);border-radius:18px;
  padding:24px;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.who{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:6px;border-radius:14px;transition:.18s}
.who.multi{cursor:pointer}
.who.multi:hover{background:rgba(255,255,255,.04)}
.who .av{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.15rem;
  background:radial-gradient(120% 120% at 30% 20%,rgba(232,112,42,.92),rgba(210,97,31,.55) 55%,rgba(232,112,42,.16));
  border:1px solid rgba(232,112,42,.55);box-shadow:0 6px 18px rgba(232,112,42,.28),inset 0 1px 0 rgba(255,255,255,.25)}
#userWrap{flex:1;min-width:0}
#userLabel{font-size:.98rem;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,#fff,#ffd9c2 55%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.usersub{margin-top:1px;font-size:.72rem;letter-spacing:.02em;color:rgba(255,255,255,.42)}
.chev{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.22s;opacity:0}
.who.multi .chev{opacity:1}
.who.open .chev{transform:rotate(180deg);stroke:var(--accent)}
.usermenu{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:20;display:none;
  background:rgba(16,16,20,.98);border:1px solid rgba(232,112,42,.3);border-radius:14px;padding:6px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);backdrop-filter:blur(16px);max-height:220px;overflow:auto}
.who.open .usermenu{display:block;animation:menuin .16s ease}
@keyframes menuin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.uitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:.14s}
.uitem:hover{background:rgba(255,255,255,.06)}
.uitem.active{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(232,112,42,.4)}
.uitem .uav{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:#fff;
  background:radial-gradient(120% 120% at 30% 20%,rgba(232,112,42,.85),rgba(210,97,31,.5) 55%,rgba(232,112,42,.15));border:1px solid rgba(232,112,42,.45)}
.uitem .uname{font-size:.92rem;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uitem.active .uname{color:var(--accent);font-weight:600}
.field{position:relative}
#password{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;color:var(--fg);
  padding:12px 46px 12px 14px;font-family:inherit;font-size:.95rem;outline:none;transition:.2s}
#password:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,112,42,.26)}
#password::placeholder{color:rgba(255,255,255,.4)}
#go{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:8px;
  background:var(--accent);color:#fff;cursor:pointer;font-size:1rem;transition:.2s}
#go:hover{background:var(--accent-hi)}
#msg{min-height:18px;margin-top:12px;font-size:.8rem;color:var(--accent);text-align:center}
.hint{margin-top:2px;font-size:.72rem;color:rgba(255,255,255,.35);text-align:center}
.greet{font-size:.86rem;letter-spacing:.01em;color:var(--muted);text-align:center;margin-top:-8px}
.greet b{color:var(--fg);font-weight:600}
#msg.error{color:#ff6b6b}
#msg.ok{color:#5fd08a}
.card.err #password{border-color:#ff5c5c;box-shadow:0 0 0 2px rgba(255,92,92,.28)}
.card.err #go{background:#ff5c5c}
.card.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
</style>
</head>
<body>
<div class="grid"></div>
<div class="diamond"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="core"></div></div>

<div class="topbar">
  <div class="host">ARXOS on <b id="host">arxos</b></div>
  <div id="clock">00:00</div>
  <div class="right">
    <div class="segwrap" title="Choose session">
      <span class="seglabel">Session</span>
      <div id="sessions" class="sessions"></div>
    </div>
    <div class="power">
      <button class="pw" id="btnSleep" title="Suspend" aria-label="Suspend"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
      <button class="pw" id="btnRestart" title="Restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg></button>
      <button class="pw" id="btnShutdown" title="Shut down" aria-label="Shut down"><svg viewBox="0 0 24 24"><path d="M12 4v8M7.5 6.5a7 7 0 1 0 9 0"/></svg></button>
    </div>
  </div>
</div>

<div class="stage">
  <div class="brand">
    <div class="name">ARXOS</div>
    <div class="tag">a citadel, armed</div>
  </div>
  <div class="greet" id="greet"></div>
  <form class="card" id="form" autocomplete="off">
    <div class="who" id="userPicker">
      <div class="av" id="avatar">A</div>
      <div id="userWrap">
        <div id="userLabel">Sign in</div>
        <div id="userSub" class="usersub">Enter password</div>
      </div>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      <div id="userMenu" class="usermenu"></div>
    </div>
    <div class="field">
      <input id="password" type="password" placeholder="Password" autofocus>
      <button id="go" type="submit" title="Log in">&#8594;</button>
    </div>
    <div id="msg"></div>
    <div class="hint">Press Enter to log in</div>
  </form>
</div>

<script>
// ---- clock ----
function tick(){
  var d=new Date(), p=n=>(n<10?'0':'')+n;
  document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes())+
    '   '+d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
}
setInterval(function(){ tick(); greeting(); },1000); tick();

var $=id=>document.getElementById(id);
function setMsg(t,kind){ var m=$('msg'); if(!m) return; m.textContent=t||''; m.className=kind||''; }
function greeting(){
  var h=new Date().getHours();
  var g = h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';
  var el=$('greet'); if(el && !el.dataset.locked) el.innerHTML=g+'. Please sign in.';
}
function shake(){
  var c=document.querySelector('.card'); if(!c) return;
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake','err');
  setTimeout(function(){ c.classList.remove('shake'); }, 520);
  setTimeout(function(){ c.classList.remove('err'); }, 1400);
}
var curUser=null;
function selectedUser(){ return curUser; }
function initials(n){ return (n||'A').charAt(0).toUpperCase(); }
function setUser(name){
  curUser=name;
  $('userLabel').textContent=name||'Sign in';
  $('avatar').textContent=initials(name);
  var m=$('userMenu'); if(m){ [].forEach.call(m.children,function(c){ c.classList.toggle('active', c.dataset.user===name); }); }
}
function buildUsers(list){
  var menu=$('userMenu'), who=$('userPicker'); if(!menu||!who) return;
  menu.innerHTML='';
  var multi=list.length>1;
  who.classList.toggle('multi', multi);
  $('userSub').textContent = multi ? 'Switch account' : 'Enter password';
  list.forEach(function(u){
    var name=u.username, disp=u.display_name||u.username;
    var it=document.createElement('div'); it.className='uitem'; it.dataset.user=name;
    var av=document.createElement('div'); av.className='uav'; av.textContent=initials(name);
    var nm=document.createElement('div'); nm.className='uname'; nm.textContent=disp;
    it.appendChild(av); it.appendChild(nm);
    it.addEventListener('click', function(ev){ ev.stopPropagation(); setUser(name); closeUserMenu(); $('password').focus(); beginAuth(); });
    menu.appendChild(it);
  });
  setUser((list[0]||{}).username || 'arxos');
}
function closeUserMenu(){ $('userPicker').classList.remove('open'); }
function toggleUserMenu(){ var p=$('userPicker'); if(p.classList.contains('multi')) p.classList.toggle('open'); }
var curSession=null;
function validSessions(){ var ss=(window.lightdm&&lightdm.sessions)||[]; var k=ss.map(x=>x.key||x.name).filter(Boolean); return k.length?k:['xfce']; }
function prettySession(k){ return String(k).replace(/[-_]/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}); }
function sessionName(k){ var m={}; ((window.lightdm&&lightdm.sessions)||[]).forEach(function(s){ m[s.key||s.name]=s.name; }); return m[k]||prettySession(k); }
function selectedSession(){ var k=validSessions(); if(curSession&&k.indexOf(curSession)>=0) return curSession; var d=window.lightdm&&lightdm.default_session; if(d&&k.indexOf(d)>=0) return d; return k[0]; }
function buildSessions(){
  var keys=validSessions(), box=$('sessions'); if(!box) return;
  box.innerHTML=''; box.classList.toggle('single', keys.length<=1);
  var sel=selectedSession(); curSession=sel;
  keys.forEach(function(k){
    var b=document.createElement('button');
    b.type='button'; b.dataset.key=k; b.className='pill'+(k===sel?' active':''); b.textContent=sessionName(k);
    b.addEventListener('click', function(){
      if(keys.length<=1) return;
      curSession=k;
      [].forEach.call(box.children,function(c){ c.classList.toggle('active', c.dataset.key===k); });
    });
    box.appendChild(b);
  });
}
function refreshAvatar(){ setUser(curUser); }

function populate(){
  greeting();
  if(!window.lightdm){ buildUsers([{username:'arxos'}]); buildSessions(); return; }
  try{ $('host').textContent = lightdm.hostname || 'arxos'; }catch(e){}
  var us=(lightdm.users||[]);
  buildUsers(us.length ? us : [{username:(lightdm.authentication_user||'arxos')}]);
  buildSessions();
}

// ---- auth flow ----
function beginAuth(){
  setMsg('');
  try{ if(lightdm.in_authentication) lightdm.cancel_authentication(); }catch(e){}
  try{ lightdm.authenticate(selectedUser()); }catch(e){ setMsg('Auth error'); }
}
function onPrompt(text,type){ $('password').focus(); }
function onMessage(text,type){ if(text) setMsg(text); }
function onAuthComplete(){
  if(window.lightdm && lightdm.is_authenticated){
    setMsg('Welcome back'+(curUser?', '+curUser:''), 'ok');
    var g=$('greet'); if(g){ g.dataset.locked='1'; g.innerHTML='Welcome back, <b>'+(curUser||'')+'</b>'; }
    try{ lightdm.start_session(selectedSession()); }catch(e){}
  } else {
    shake();
    $('password').value='';
    beginAuth();                                          // restarts auth (clears msg internally)
    setMsg('Incorrect password. Try again.','error');     // set AFTER beginAuth so it persists
    $('password').focus();
  }
}

// web-greeter uses lightdm.<signal>.connect(); classic greeters use window.<name>. Support both.
function wireLightdm(){
  if(!window.lightdm) return false;
  var L=lightdm;
  function conn(sig, fn){
    try{ if(L[sig] && typeof L[sig].connect==='function'){ L[sig].connect(fn); return; } }catch(e){}
    window[sig]=fn;
  }
  conn('show_prompt', onPrompt);
  conn('show_message', onMessage);
  conn('authentication_complete', onAuthComplete);
  conn('autologin_timer_expired', function(){});
  populate(); refreshAvatar(); beginAuth();
  return true;
}
window.addEventListener('GreeterReady', wireLightdm);
document.addEventListener('DOMContentLoaded', function(){ if(!wireLightdm()){ populate(); refreshAvatar(); } });

// submit the password
$('form').addEventListener('submit', function(ev){
  ev.preventDefault();
  var pw=$('password').value;
  if(!window.lightdm){ setMsg('(preview: greeter not running)'); return; }
  try{
    if(lightdm.in_authentication){ lightdm.respond(pw); }
    else { beginAuth(); setTimeout(function(){ try{lightdm.respond(pw);}catch(e){} }, 140); }
  }catch(e){ setMsg('Login error'); }
});
$('userPicker').addEventListener('click', toggleUserMenu);
document.addEventListener('click', function(e){ var p=$('userPicker'); if(p && !p.contains(e.target)) closeUserMenu(); });

$('btnSleep').onclick   = ()=>{ try{lightdm.suspend();}catch(e){} };
$('btnRestart').onclick = ()=>{ try{lightdm.restart();}catch(e){} };
$('btnShutdown').onclick= ()=>{ try{lightdm.shutdown();}catch(e){} };
</script>
</body>
</html>
